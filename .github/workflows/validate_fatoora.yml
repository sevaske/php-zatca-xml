name: Validate Invoice with Fatoora

on: [push, pull_request]

jobs:
  validate_invoice:
    runs-on: ubuntu-latest

    # Download URL of the ZATCA e-invoicing SDK for Java (zip). ZATCA publishes it only behind a login
    # (https://sandbox.zatca.gov.sa/downloadSDK), so keep a copy, e.g. as a release asset of this repository,
    # and set its URL as the repository variable ZATCA_SDK_URL (Settings > Secrets and variables > Actions > Variables).
    env:
      ZATCA_SDK_URL: ${{ vars.ZATCA_SDK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json, curl, openssl

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate and sign the example documents
        run: |
          php examples/InvoiceSimplified/simplified_invoice.php
          php examples/InvoiceSimplified/simplified_debit_note.php
          php examples/InvoiceSimplified/simplified_credit_note.php
          php examples/InvoiceStandard/standard_invoice.php
          php examples/InvoiceStandard/standard_invoice_debit_note.php
          php examples/InvoiceStandard/standard_invoice_credit_note.php

      - name: Set up Java 11 (required by the SDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download the ZATCA SDK
        run: |
          if [ -z "$ZATCA_SDK_URL" ]; then
            echo "::error::Repository variable ZATCA_SDK_URL is not set: point it to a zip of the ZATCA e-invoicing SDK for Java."
            exit 1
          fi
          curl -fsSL -o sdk.zip "$ZATCA_SDK_URL"
          unzip -tq sdk.zip || { echo "::error::The file at ZATCA_SDK_URL is not a valid zip archive."; exit 1; }
          unzip -q sdk.zip -d sdk

      - name: Validate the signed documents with the SDK
        run: |
          set -o pipefail

          FATOORA="$(find "$PWD/sdk" -type f -path '*/Apps/fatoora' | head -n 1)"
          if [ -z "$FATOORA" ]; then
            echo "::error::Apps/fatoora not found in the SDK archive."
            exit 1
          fi

          SDK_HOME="$(dirname "$(dirname "$FATOORA")")"
          cd "$SDK_HOME/Configuration"

          # config.json with absolute paths, built from the file names in defaults.json
          name() { basename "$(jq -r ".$1" defaults.json)"; }
          jq -n \
            --arg xsd "$SDK_HOME/Data/Schemas/xsds/UBL2.1/xsd/maindoc/$(name xsdPath)" \
            --arg en "$SDK_HOME/Data/Rules/schematrons/$(name enSchematron)" \
            --arg ksa "$SDK_HOME/Data/Rules/schematrons/$(name zatcaSchematron)" \
            --arg cert "$SDK_HOME/Data/Certificates/$(name certPath)" \
            --arg key "$SDK_HOME/Data/Certificates/$(name privateKeyPath)" \
            --arg pih "$SDK_HOME/Data/PIH/$(name pihPath)" \
            --arg input "$SDK_HOME/Data/Input" \
            --arg usage "$SDK_HOME/Configuration/$(name usagePathFile)" \
            '{xsdPath: $xsd, enSchematron: $en, zatcaSchematron: $ksa, certPath: $cert, privateKeyPath: $key, pihPath: $pih, inputPath: $input, usagePathFile: $usage}' \
            > config.json

          export SDK_CONFIG="$SDK_HOME/Configuration/config.json"
          export FATOORA_HOME="$SDK_HOME/Apps"
          export PATH="$PATH:$FATOORA_HOME"
          chmod +x "$FATOORA"

          failed=0
          for invoice in "$GITHUB_WORKSPACE"/examples/*/output/*_Signed.xml; do
            echo "::group::$(basename "$invoice")"
            fatoora -validate -invoice "$invoice" | tee validation.log || true
            echo "::endgroup::"

            if ! grep -Eq 'GLOBAL VALIDATION RESULT *= *PASSED' validation.log; then
              echo "::error::Validation failed: $(basename "$invoice")"
              failed=1
            fi
          done

          exit $failed
